<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Character House</title>
  <!-- the saved theme, before the first paint (no flash) -->
  <script>
    try {
      if (localStorage.getItem("character-house-theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch {}
  </script>
  <link rel="stylesheet" href="lamp/lamp.css" />
  <link rel="stylesheet" href="curtain/curtain.css" />
  <link rel="stylesheet" href="chair/chair.css" />
  <link rel="stylesheet" href="clock/clock.css" />
  <link rel="stylesheet" href="table/table.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a href="./">Character House</a>
    <!-- Lucide volume-2 / volume-off (ISC, lucide.dev) -->
    <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9a5 5 0 0 1 .95 2.293"/><path d="M19.364 5.636a9 9 0 0 1 1.889 9.96"/><path d="m2 2 20 20"/><path d="m7 7-.587.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298V11"/><path d="M9.828 4.172A.686.686 0 0 1 11 4.657v.686"/></svg>
    </button>
  </nav>
  <!-- One piece at a time, live; house.js mounts it here. -->
  <main class="stage" id="stage"></main>
  <p class="entry" id="entry" aria-live="polite"><span class="glyph" lang="zh-Hans"></span> <span class="meaning"></span></p>
  <!-- Phosphor ArrowLeft / ArrowRight, regular (MIT, phosphoricons.com) -->
  <button class="turn prev" id="prev" type="button" aria-label="Previous">
    <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
  </button>
  <button class="turn next" id="next" type="button" aria-label="Next">
    <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>
  </button>
  <script type="module" src="house.js"></script>
</body>
</html>
