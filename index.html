<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Character House</title>
  <!-- the saved theme, before the first paint (no flash) -->
  <script>
    try {
      if (localStorage.getItem("character-house-theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch {}
  </script>
  <link rel="stylesheet" href="lamp/lamp.css" />
  <link rel="stylesheet" href="curtain/curtain.css" />
  <link rel="stylesheet" href="chair/chair.css" />
  <link rel="stylesheet" href="clock/clock.css" />
  <link rel="stylesheet" href="table/table.css" />
  <link rel="stylesheet" href="room.css" />
</head>
<body>
  <nav class="nav">
    <a href="./" lang="en">Character House</a>
    <span class="nav-end">
      <!-- Phosphor SpeakerHigh / SpeakerSlash, regular (MIT, phosphoricons.com) -->
      <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="on" viewBox="0 0 256 256" aria-hidden="true"><path d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"/></svg>
        <svg class="off" viewBox="0 0 256 256" aria-hidden="true"><path d="M53.92,34.62A8,8,0,1,0,42.08,45.38L73.55,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V184.69l42.08,46.29a8,8,0,1,0,11.84-10.76ZM32,96H72v64H32ZM144,207.64,88,164.09V95.89l56,61.6Zm42-63.77a24,24,0,0,0,0-31.72,8,8,0,1,1,12-10.57,40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.59Zm-80.16-76.3a8,8,0,0,1-1.4-11.23l39.85-31A8,8,0,0,1,160,32v74.83a8,8,0,0,1-16,0V48.36l-26.94,21A8,8,0,0,1,105.84,67.57ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z"/></svg>
      </button>
      <a href="dictionary/" lang="en">Dictionary</a>
    </span>
  </nav>
  <main class="room" id="room">
    <div class="pieces" id="pieces"></div>
    <!-- Furniture drawer: tap or pull the handle; drag a card into the room, drag a piece
         back here to put it away. Cards are filled in by room.js. -->
    <section class="drawer" id="drawer" aria-label="Furniture" lang="en">
      <button class="handle" id="handle" type="button" aria-label="Furniture" aria-expanded="false">
        <span class="bar"></span>
      </button>
      <div class="cards" id="cards"></div>
    </section>
  </main>
  <script type="module" src="room.js"></script>
</body>
</html>
